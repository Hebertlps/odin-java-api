version: '3.8'

services:
  app:
    build:
      context: ./odin-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:-oracle.fiap.com.br}
      - DB_PORT=${DB_PORT:-1521}
      - DB_SID=${DB_SID:-ORCL}
      - DB_USER=${DB_USER:-seu_usuario}
      - DB_PASS=${DB_PASS:-sua_senha}
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - odin-network
    restart: unless-stopped

networks:
  odin-network:
    driver: bridge
